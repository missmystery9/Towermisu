<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>TOWERMISU — Camera Fix</title>
<style>
html,body{margin:0;height:100%;background:#efe4cf;font-family:Arial,sans-serif;color:#4d2e20}
body{display:grid;place-items:center}
.wrap{position:relative;width:min(92vw,760px);height:min(88vh,680px);background:#f7efdf;border:2px solid #d4bea0;border-radius:24px;box-shadow:0 16px 50px #6b4a2b22;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.ui{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between;pointer-events:none}
.brand{font-weight:900;letter-spacing:.08em;font-size:25px}
.stats{display:flex;gap:14px;font-size:13px;font-weight:700}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#f7efdfcc}
.card{text-align:center;background:#fff8ea;border:2px solid #d4bea0;border-radius:22px;padding:30px 38px;box-shadow:0 12px 35px #6b4a2b22}
.card h1{margin:0 0 8px;font-size:42px;letter-spacing:.05em}
.card p{margin:8px 0 20px}
button{border:0;border-radius:999px;padding:12px 22px;background:#6b3f28;color:#fff8ea;font-weight:800;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<canvas id="game"></canvas>
<div class="ui">
  <div class="brand">TOWERMISU</div>
  <div class="stats"><span>LAYERS <b id="layers">0</b></span><span>BEST <b id="best">0</b></span></div>
</div>
<div class="overlay" id="start">
  <div class="card"><h1>TOWERMISU</h1><p>Stack the tiramisu as high as you can.</p><button id="startBtn">START</button></div>
</div>
<div class="overlay hidden" id="over">
  <div class="card"><h1>CAKE COLLAPSE</h1><p><span id="final">0</span> layers</p><button id="again">TRY AGAIN</button></div>
</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
const layersEl=document.getElementById('layers'),bestEl=document.getElementById('best');
const start=document.getElementById('start'),over=document.getElementById('over'),finalEl=document.getElementById('final');
let W,H,dpr=1;

function resize(){
  dpr=devicePixelRatio||1;
  W=wrap.clientWidth; H=wrap.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

const HGT=30, GROUND=H-70;
let blocks=[], active=null, running=false, camera=0, targetCamera=0, score=0, particles=[], popups=[];
let best=+localStorage.towermisuBest||0;
bestEl.textContent=best;

function reset(){
  blocks=[];
  particles=[];
  popups=[];
  score=0;
  camera=0;
  targetCamera=0;
  const baseW=Math.min(270,W*.48);
  blocks.push({x:(W-baseW)/2,y:GROUND-HGT,w:baseW,type:'biscuit'});
  spawn();
  updateUI();
}

function spawn(){
  const prev=blocks[blocks.length-1];
  const speed=Math.min(350,145+blocks.length*7);
  active={x:Math.random()<.5?20:W-prev.w-20,y:prev.y-HGT,w:prev.w,type:blocks.length%2?'cream':'biscuit',vx:Math.random()<.5?speed:-speed};
}

function burst(x,y,count=12,kind='crumb'){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=35+Math.random()*120;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-25,
      life:.45+Math.random()*.5,
      max:.45+Math.random()*.5,
      size:kind==='dust'?1.5+Math.random()*3:2+Math.random()*4,
      kind
    });
  }
}

function addPopup(text,x,y){
  popups.push({text,x,y,life:1,max:1});
}

function drop(){
  if(!running)return;
  const prev=blocks[blocks.length-1], a=active;
  const left=Math.max(a.x,prev.x), right=Math.min(a.x+a.w,prev.x+prev.w);
  const overlap=right-left;

  if(overlap<=2){
    burst(a.x+a.w/2,a.y+HGT/2,18,'dust');
    running=false;
    finalEl.textContent=score;
    best=Math.max(best,score);
    localStorage.towermisuBest=best;
    bestEl.textContent=best;
    over.classList.remove('hidden');
    return;
  }

  const perfect=Math.abs(overlap-prev.w)<4;
  const newY=prev.y-HGT;

  // Trimmed-off overhang becomes falling crumbs.
  const leftWaste=Math.max(0,left-a.x);
  const rightWaste=Math.max(0,(a.x+a.w)-right);
  if(leftWaste>2){
    burst(a.x+leftWaste/2,newY+HGT/2,Math.min(8,Math.ceil(leftWaste/5)),'crumb');
  }
  if(rightWaste>2){
    burst(right+rightWaste/2,newY+HGT/2,Math.min(8,Math.ceil(rightWaste/5)),'crumb');
  }

  blocks.push({x:left,y:newY,w:perfect?prev.w:overlap,type:a.type});
  score++;

  // Every successful landing gets a small cocoa/crumb puff.
  burst((left+right)/2,newY+2,perfect?14:9,'dust');

  if(perfect){
    addPopup('YES CHEF!',(left+right)/2,newY-8);
    burst((left+right)/2,newY+HGT/2,18,'dust');
  }

  spawn();
  updateUI();
}
function updateUI(){layersEl.textContent=score+1}

function update(dt){
  // Particles and feedback continue animating during gameplay and after game-over.
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=260*dt;
    p.vx*=Math.pow(.03,dt);
    if(p.life<=0)particles.splice(i,1);
  }

  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];
    p.life-=dt;
    p.y-=28*dt;
    if(p.life<=0)popups.splice(i,1);
  }

  if(!running)return;
  active.x+=active.vx*dt;
  if(active.x<=10){active.x=10;active.vx=Math.abs(active.vx)}
  if(active.x+active.w>=W-10){active.x=W-10-active.w;active.vx=-Math.abs(active.vx)}

  /*
    IMPORTANT CAMERA LOGIC:
    block.y is WORLD SPACE and never changes because of the camera.
    screenY = worldY + camera.
    The camera follows the newest block only when it approaches
    the top safe zone. This makes the tower appear stationary while
    the viewport scrolls upward.
  */
  const newestY=active.y;
  const topSafe=95;
  const desired=topSafe-newestY;
  targetCamera=Math.max(0,desired);
  camera += (targetCamera-camera)*Math.min(1,dt*6);
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function drawLayer(b,sy){
  ctx.save();
  if(b.type==='biscuit'){
    ctx.fillStyle='#8b542f'; roundedRect(b.x,sy,b.w,HGT,6);
    ctx.fillStyle='#b87948';
    for(let x=b.x+14;x<b.x+b.w-8;x+=25){ctx.beginPath();ctx.arc(x,sy+HGT/2,2,0,7);ctx.fill()}
    ctx.fillStyle='#704025';ctx.fillRect(b.x,sy,b.w,5);
  }else{
    // A warmer, slightly darker mascarpone tone gives the cream layer
    // enough separation from the paper background.
    ctx.fillStyle='#e5d2aa';
    roundedRect(b.x,sy,b.w,HGT,7);

    // Soft illustrated outer edge.
    ctx.fillStyle='#c5a982';
    ctx.fillRect(b.x+1,sy+HGT-4,b.w-2,3);

    // Cream highlight.
    ctx.fillStyle='#f6ead0';
    ctx.fillRect(b.x+5,sy+4,b.w-10,7);

    // Tiny uneven cream marks for a hand-painted feel.
    ctx.fillStyle='#d5bc91';
    for(let x=b.x+14;x<b.x+b.w-8;x+=30){
      ctx.beginPath();
      ctx.arc(x,sy+19,1.5,0,7);
      ctx.fill();
    }
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f2e5cf';ctx.fillRect(0,0,W,H);

  // subtle paper dots
  ctx.fillStyle='#8b6a4a12';
  for(let y=0;y<H;y+=28)for(let x=0;x<W;x+=28)ctx.fillRect(x,y,1,1);

  // Ground is also in world space.
  const groundScreen=GROUND+camera;
  ctx.fillStyle='#d5b990';ctx.fillRect(0,groundScreen,W,8);

  // Draw ALL layers using exactly one camera transform: y + camera.
  for(const b of blocks){
    const sy=b.y+camera;
    if(sy>-HGT-10 && sy<H+10)drawLayer(b,sy);
  }

  if(active){
    drawLayer(active,active.y+camera);
  }

  // guide line showing the safe top zone
  ctx.setLineDash([5,8]);
  ctx.strokeStyle='#9b795c44';
  ctx.beginPath();ctx.moveTo(18,95);ctx.lineTo(W-18,95);ctx.stroke();
  ctx.setLineDash([]);

  // small camera indicator
  if(running && camera>2){
    ctx.fillStyle='#6b3f2888';ctx.font='700 11px Arial';
    ctx.fillText('CAMERA TRACKING',20,118);
  }

  // Tactile cocoa dust + crumbs. These are drawn in screen space
  // using the same camera offset as the tower.
  for(const p of particles){
    const sy=p.y+camera;
    if(sy<-20 || sy>H+20) continue;
    const alpha=Math.max(0,p.life/p.max);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.kind==='dust' ? '#7a4a2f' : '#9b6339';
    ctx.beginPath();
    ctx.arc(p.x,sy,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const p of popups){
    const sy=p.y+camera;
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.textAlign='center';
    ctx.font='900 24px Arial';
    ctx.fillStyle='#6b3f28';
    ctx.fillText(p.text,p.x,sy);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='start';
}

let last=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame(){reset();running=true;start.classList.add('hidden');over.classList.add('hidden')}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('again').onclick=startGame;
canvas.addEventListener('pointerdown',drop);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); if(!running && !start.classList.contains('hidden'))startGame(); else if(!running)startGame(); else drop()}});
</script>
</body>
</html>
